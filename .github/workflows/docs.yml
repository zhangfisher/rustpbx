# 将 api-docs（VitePress）构建并自动发布到 GitHub Pages
#
# 启用前提：仓库 Settings → Pages → Build and deployment → Source 选择 "GitHub Actions"
# 发布地址：https://zhangfisher.github.io/rustpbx/
name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'api-docs/**'
      - '.github/workflows/docs.yml'
  # 也支持在 Actions 页面手动触发
  workflow_dispatch:

# Pages 部署所需的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个 Pages 部署；进行中的部署不取消，后续 push 排队
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api-docs/package-lock.json

      - name: Install dependencies
        working-directory: api-docs
        run: npm ci

      - name: Build VitePress site
        working-directory: api-docs
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: api-docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
